# ==============================================================================
# Prometheus Configuration — Smart Factory IoT Platform
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: smart-factory
    environment: production

# Alert rules
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # ── Prometheus self-monitoring ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # ── FastAPI Backend ──
  - job_name: "backend"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend
          layer: application

  # ── Kafka Broker Metrics (via JMX Exporter) ──
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9092"]
        labels:
          service: kafka
          layer: infrastructure

  # ── PostgreSQL (via pg_exporter if deployed) ──
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          layer: infrastructure

  # ── Node Exporter (host metrics) ──
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter
          layer: infrastructure

  # ── Airflow Webserver (StatsD metrics) ──
  - job_name: "airflow"
    static_configs:
      - targets: ["airflow-webserver:8080"]
        labels:
          service: airflow
          layer: pipeline
    metrics_path: /health

  # ── Grafana ──
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
          layer: monitoring

  # ── Loki ──
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki
          layer: monitoring
    metrics_path: /metrics
