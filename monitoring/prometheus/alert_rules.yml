# ==============================================================================
# Prometheus Alert Rules — Smart Factory IoT Platform
# ==============================================================================

groups:
  # ── API / Application Alerts ──
  - name: api_alerts
    rules:
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="backend"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High API latency detected"
          description: "95th percentile API latency is above 2 seconds for the last 5 minutes. Current value: {{ $value | humanizeDuration }}"
          runbook_url: "https://wiki.internal/runbooks/high-api-latency"

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{job="backend", status=~"5.."}[5m])) / sum(rate(http_requests_total{job="backend"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High 5xx error rate"
          description: "More than 5% of API requests are returning 5xx errors. Current rate: {{ $value | humanizePercentage }}"
          runbook_url: "https://wiki.internal/runbooks/high-error-rate"

      - alert: HighRequestRate
        expr: sum(rate(http_requests_total{job="backend"}[5m])) > 1000
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Unusually high request rate"
          description: "Backend is receiving more than 1000 req/s for the last 10 minutes. Current: {{ $value | humanize }} req/s"

  # ── Infrastructure Alerts ──
  - name: infrastructure_alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for the last 10 minutes. Current: {{ $value | humanize }}%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for the last 10 minutes. Current: {{ $value | humanize }}%"

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage on root partition is above 85%. Current: {{ $value | humanize }}%"

      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus target {{ $labels.instance }} for job {{ $labels.job }} has been unreachable for more than 2 minutes."

  # ── Kafka Alerts ──
  - name: kafka_alerts
    rules:
      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 1000
        for: 5m
        labels:
          severity: warning
          team: data-pipeline
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} has a lag of {{ $value }} messages on topic {{ $labels.topic }}."

      - alert: KafkaBrokerDown
        expr: count(kafka_server_replicamanager_leadercount) < 1
        for: 2m
        labels:
          severity: critical
          team: data-pipeline
        annotations:
          summary: "Kafka broker is down"
          description: "No Kafka broker leaders detected. The Kafka cluster may be unavailable."

      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_server_replicamanager_underreplicatedpartitions > 0
        for: 5m
        labels:
          severity: warning
          team: data-pipeline
        annotations:
          summary: "Kafka has under-replicated partitions"
          description: "There are {{ $value }} under-replicated partitions in the Kafka cluster."

  # ── Database Alerts ──
  - name: database_alerts
    rules:
      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "PostgreSQL has high connection count"
          description: "PostgreSQL has {{ $value }} active connections. Max is typically 100."

      - alert: PostgresSlowQueries
        expr: pg_stat_activity_max_tx_duration{datname="smart_factory"} > 300
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "PostgreSQL has long-running queries"
          description: "There are queries running for more than 5 minutes in the smart_factory database."

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname="smart_factory"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "Deadlocks detected in the smart_factory database in the last 5 minutes."
